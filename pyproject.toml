[project]
name = "moederncolbert-onnx"
version = "0.1.0"
description = "Pinned MoEdernColBERT 1.5M and 27M ONNX exports in five precisions, with upstream and cross-runtime parity checks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.13.0",
  "transformers>=5.3,<6",
  "sentence-transformers>=6.1,<7",
  "onnx>=1.17,<2",
  "onnxruntime>=1.21,<2",
  "safetensors>=0.5,<1",
  "numpy>=1.26,<3",
  "huggingface-hub>=0.34,<2",
  "onnx-ir>=0.1,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
moedern-onnx = "moederncolbert_onnx.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
