<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Runtime parity harness</title><link rel="icon" href="data:,"></head>
<body><p>Automated WASM parity harness. Use the main page for the interactive demonstration.</p>
<script type="module">
import { createBrowserEncoder } from './src/browser.ts';
import { verifyEncoders } from './scripts/parity-check.mjs';
window.runParity = async repo => {
  const response = await fetch(`/fixtures/${repo}.json`);
  if (!response.ok) throw new Error(`Parity fixture for ${repo}: HTTP ${response.status}`);
  const fixture = await response.json();
  return verifyEncoders(precision => createBrowserEncoder(`/models/${repo}/`, { precision, wasmPath: '/ort/' }), fixture);
};
</script></body></html>
